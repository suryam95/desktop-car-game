<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Desktop Drifter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
            /* Let clicks pass through by default */
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* When we need to capture clicks (Edit Mode), we'll add this class */
        .interactive {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.1);
            /* Slight tint to show edit mode */
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    <script src="renderer.js"></script>
</body>

</html>
